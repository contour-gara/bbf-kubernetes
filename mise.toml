[tools]
go = "1.26.5"
jq = "1.8.2"
k9s = "0.51.0"
kind = "0.20.0"
kubectl = "1.29.0"
kubectx = "0.11.0"
kubens = "0.11.0"
stern = "1.34.0"

[hooks.enter]
shell = "zsh"
script = '''
_kubectl_completion_init() {
  add-zsh-hook -d precmd _kubectl_completion_init
  unfunction _kubectl_completion_init
  (( $+functions[compdef] )) && source <(kubectl completion zsh)
}
autoload -Uz add-zsh-hook
add-zsh-hook precmd _kubectl_completion_init
'''

[hooks.leave]
shell = "zsh"
script = "add-zsh-hook -d precmd _kubectl_completion_init 2>/dev/null; compdef -d kubectl 2>/dev/null; unfunction _kubectl 2>/dev/null; true"

[env]
KUBE_EDITOR = "nvim"
