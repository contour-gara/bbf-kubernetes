[tools]
go = "1.26.5"
jq = "1.8.2"
k9s = "0.51.0"
kind = "0.20.0"
kubectl = "1.29.0"
kubectx = "0.11.0"
kubens = "0.11.0"
stern = "1.34.0"

[hooks.enter]
shell = "zsh"
script = "source <(kubectl completion zsh)"

[hooks.leave]
shell = "zsh"
script = "compdef -d kubectl 2>/dev/null; unfunction _kubectl 2>/dev/null; true"
